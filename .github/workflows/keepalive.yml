name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 4-22 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 23 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -fsS --max-time 20 "https://study-helper-bot-egpl.onrender.com" >/dev/null || true
